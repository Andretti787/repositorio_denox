<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - {{ usuario }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <a href="/" class="back-link">
                    <i class="fas fa-arrow-left"></i> Volver al Resumen
                </a>
                <a href="/logout" class="logout-link" style="margin-left: auto; color: white; text-decoration: none;">
                    <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                </a>
                <i class="fas fa-list header-icon"></i>
                <h1>Pedidos por Usuario</h1>
                <p class="subtitle">Usuario: <strong>{{ usuario }}</strong></p>
            </div>
        </header>

        <main class="main-content">
            <!-- Barra de herramientas -->
            <div class="toolbar">
                <button id="refresh-btn" class="btn btn-primary">
                    <i class="fas fa-sync-alt"></i> Actualizar Datos
                </button>
                <button id="export-btn" class="btn btn-secondary" disabled>
                    <i class="fas fa-download"></i> Exportar CSV
                </button>
                <div class="status-indicator">
                    <span id="status-text">Esperando...</span>
                    <span id="connection-status" class="status-dot"></span>
                </div>
            </div>

            <!-- Tabla de datos -->
            <div class="table-container">
                <table id="pedidos-table" class="data-table">
                    <thead>
                        <tr>
                            <th>Nº Pedido</th>
                            <th>Usuario</th>
                            <th>Nombre</th>
                            <th>Estado</th>
                            <th class="number">Líneas</th>
                            <th class="number">Importe Total</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Los datos se cargarán dinámicamente -->
                    </tbody>
                    <tfoot id="table-footer">
                        <!-- Totales -->
                    </tfoot>
                </table>
            </div>

            <!-- Mensaje de error -->
            <div id="error-message" class="error-message" style="display: none;">
                <i class="fas fa-exclamation-triangle"></i>
                <span id="error-text"></span>
            </div>

            <!-- Loading -->
            <div id="loading" class="loading-overlay" style="display: none;">
                <div class="loading-content">
                    <div class="loading-spinner"></div>
                    <p>Cargando datos...</p>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>Última actualización: <span id="last-update">--</span></p>
            <p>Aplicación v1.0.0</p>
        </footer>
    </div>

    <script>
        // Pasar datos a JavaScript
        const USUARIO = '{{ usuario }}';
    </script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
